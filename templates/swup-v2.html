<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Team SWUP · Spatial Constellation V2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Montserrat:ital,wght@0,600;0,700;0,800;1,600;1,700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="../db-shim.js?v=20260928b"></script>
    <script src="../i18n.js?v=20260928b"></script>
    <style>
        :root {
            --bg-canvas: #060912;
            --accent-cyan: #54e8ff;
            --accent-glow: rgba(84, 232, 255, 0.35);
            --rtu-gold: #ffd043;
            --rtu-burgundy: #a6192e;
            --text-main: #f8fafc;
            --text-dim: rgba(248, 250, 252, 0.7);
            --text-muted: rgba(248, 250, 252, 0.45);
            --card-glass: rgba(10, 24, 38, 0.72);
            --card-border: rgba(84, 232, 255, 0.28);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            min-height: 100%;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg-canvas);
            color: var(--text-main);
            font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
            touch-action: pan-x pan-y;
            overscroll-behavior: none;
            -webkit-user-select: none;
            user-select: none;
        }

        /* ── Stage & Background ── */
        .ar-stage, .permission-screen {
            position: fixed;
            inset: 0;
            overflow: hidden;
        }

        .camera-feed {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            filter: saturate(0.85) contrast(1.08) brightness(0.88);
            z-index: 1;
        }
        .camera-feed.is-ready { opacity: 1; }

        .stage-backdrop {
            position: absolute;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            background: radial-gradient(circle at 50% 30%, rgba(84, 232, 255, 0.08) 0%, rgba(6, 14, 24, 0.5) 60%, rgba(2, 6, 12, 0.94) 100%),
                        linear-gradient(180deg, rgba(6, 14, 24, 0.7) 0%, transparent 25%, transparent 70%, rgba(2, 6, 12, 0.88) 100%);
        }

        .scanlines {
            position: absolute;
            inset: 0;
            z-index: 3;
            pointer-events: none;
            opacity: 0.16;
            background: repeating-linear-gradient(0deg, rgba(84, 232, 255, 0.15) 0 1px, transparent 1px 4px);
            mix-blend-mode: screen;
        }

        /* ── Header HUD ── */
        .top-hud {
            position: absolute;
            top: clamp(14px, 3.5vw, 32px);
            left: clamp(14px, 4vw, 44px);
            right: clamp(14px, 4vw, 44px);
            z-index: 25;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
        }

        .brand-lockup {
            display: flex;
            align-items: center;
            gap: 12px;
            pointer-events: auto;
        }
        .brand-orb {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            border: 1px solid var(--accent-cyan);
            background: rgba(84, 232, 255, 0.15);
            display: grid;
            place-items: center;
            color: var(--accent-cyan);
            font-size: 16px;
            box-shadow: 0 0 16px var(--accent-glow);
        }
        .brand-text h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(16px, 2.2vw, 22px);
            font-weight: 800;
            letter-spacing: -0.03em;
            color: #ffffff;
        }
        .brand-text p {
            font-family: 'DM Mono', monospace;
            font-size: 9.5px;
            font-weight: 600;
            color: var(--accent-cyan);
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        .hud-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            pointer-events: auto;
        }

        .tracking-pill {
            display: flex;
            gap: 8px;
            align-items: center;
            padding: 6px 14px;
            color: var(--text-main);
            font-family: 'DM Mono', monospace;
            font-size: 10.5px;
            font-weight: 600;
            border: 1px solid var(--card-border);
            border-radius: 999px;
            background: rgba(10, 24, 38, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .tracking-pill i {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent-cyan);
            box-shadow: 0 0 10px var(--accent-cyan);
            animation: pulse-dot 2s infinite ease-in-out;
        }
        @keyframes pulse-dot {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.3); opacity: 1; box-shadow: 0 0 16px var(--accent-cyan); }
        }

        /* Language Switcher */
        .lang-switcher {
            display: inline-flex;
            background: rgba(10, 24, 38, 0.75);
            border: 1px solid var(--card-border);
            border-radius: 999px;
            padding: 3px;
            gap: 2px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .lang-switcher-btn {
            background: transparent;
            border: none;
            color: var(--text-dim);
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: 999px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .lang-switcher-btn:hover { color: #ffffff; background: rgba(255,255,255,0.08); }
        .lang-switcher-btn.active {
            background: var(--accent-cyan);
            color: #020b13;
            font-weight: 800;
            box-shadow: 0 2px 14px var(--accent-glow);
        }

        /* ── Main Constellation View ── */
        .main-stage {
            position: absolute;
            inset: 0;
            z-index: 10;
            overflow-y: auto;
            padding: clamp(75px, 12vh, 100px) clamp(16px, 4vw, 44px) clamp(24px, 4vh, 48px);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .main-stage::-webkit-scrollbar { width: 5px; }
        .main-stage::-webkit-scrollbar-thumb { background: rgba(84, 232, 255, 0.35); border-radius: 3px; }

        .stage-banner {
            text-align: center;
            margin-bottom: 28px;
            max-width: 680px;
        }
        .stage-banner h2 {
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(28px, 4.4vw, 48px);
            font-weight: 800;
            letter-spacing: -0.04em;
            line-height: 1.05;
            color: #ffffff;
            margin-bottom: 8px;
        }
        .stage-banner h2 em {
            color: var(--accent-cyan);
            font-style: italic;
        }
        .stage-banner p {
            color: var(--text-dim);
            font-size: 14px;
        }

        /* ── Constellation Grid ── */
        .constellation-wrapper {
            position: relative;
            width: min(100%, 940px);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Central Team Hub Node */
        .hub-node {
            position: relative;
            width: min(100%, 360px);
            padding: 18px 20px;
            border-radius: 24px;
            background: var(--card-glass);
            border: 1.5px solid var(--accent-cyan);
            box-shadow: 0 16px 50px rgba(0,0,0,0.6), 0 0 40px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,0.2);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            text-align: center;
            z-index: 10;
        }
        .hub-node:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 22px 65px rgba(0,0,0,0.7), 0 0 55px var(--accent-glow);
        }

        .hub-photo-frame {
            position: relative;
            height: 140px;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 14px;
            border: 1px solid rgba(84, 232, 255, 0.5);
            background: linear-gradient(135deg, rgba(84, 232, 255, 0.15), rgba(0,0,0,0.4));
        }
        .hub-photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .hub-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: #ffffff;
            text-transform: uppercase;
        }
        .hub-subtitle {
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            color: var(--accent-cyan);
            letter-spacing: 0.12em;
            margin-top: 3px;
        }

        /* Connecting Hologram Struts */
        .constellation-struts {
            position: relative;
            width: 80%;
            height: 54px;
            pointer-events: none;
        }
        .strut-stem {
            position: absolute;
            top: 0;
            left: 50%;
            width: 2px;
            height: 28px;
            background: linear-gradient(var(--accent-cyan), rgba(84, 232, 255, 0.2));
            box-shadow: 0 0 10px var(--accent-cyan);
        }
        .strut-bar {
            position: absolute;
            top: 28px;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-cyan) 15%, var(--accent-cyan) 85%, transparent);
            box-shadow: 0 0 12px var(--accent-cyan);
        }

        /* Member Nodes Grid */
        .members-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            width: 100%;
            margin-top: 6px;
        }

        .member-card-v2 {
            position: relative;
            padding: 16px;
            border-radius: 20px;
            background: var(--card-glass);
            border: 1px solid var(--card-border);
            box-shadow: 0 12px 36px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.15);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .member-card-v2:hover {
            border-color: var(--member-accent, var(--accent-cyan));
            box-shadow: 0 18px 48px rgba(0,0,0,0.65), 0 0 32px var(--member-accent, var(--accent-cyan));
            transform: translateY(-5px) scale(1.03);
        }

        .member-portrait-frame {
            position: relative;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid var(--member-accent, var(--accent-cyan));
            box-shadow: 0 0 20px var(--member-accent, var(--accent-cyan));
            margin-bottom: 12px;
            background: rgba(0,0,0,0.5);
            display: grid;
            place-items: center;
            font-family: 'DM Mono', monospace;
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
        }
        .member-portrait-frame img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .member-name {
            font-family: 'Montserrat', sans-serif;
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.02em;
        }
        .member-role {
            font-family: 'DM Mono', monospace;
            font-size: 10.5px;
            color: var(--member-accent, var(--accent-cyan));
            margin-top: 3px;
            letter-spacing: 0.05em;
        }
        .member-specialty {
            font-size: 11px;
            color: var(--text-dim);
            margin-top: 4px;
        }

        /* ── Permission / Gate Screen ── */
        .permission-screen {
            display: grid;
            place-items: center;
            padding: 24px;
            background: radial-gradient(circle at 50% 25%, #0c2035 0%, #060912 75%);
            z-index: 50;
        }
        .permission-card {
            width: min(100%, 420px);
            padding: 36px 30px;
            border: 1px solid rgba(84, 232, 255, 0.4);
            border-radius: 28px;
            background: rgba(10, 24, 38, 0.75);
            box-shadow: 0 24px 65px rgba(0, 0, 0, 0.6), 0 0 60px var(--accent-glow), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(36px);
            -webkit-backdrop-filter: blur(36px);
            text-align: center;
        }
        .permission-card h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.03em;
            margin: 12px 0 8px;
        }
        .permission-copy {
            color: var(--text-dim);
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 24px;
        }
        .primary-cta-btn {
            display: inline-block;
            width: 100%;
            padding: 14px 24px;
            border-radius: 999px;
            border: none;
            background: linear-gradient(135deg, #54e8ff 0%, #00b0ff 100%);
            color: #020b13;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 20px var(--accent-glow);
            transition: all 0.2s ease;
        }
        .primary-cta-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px var(--accent-glow);
        }

        /* GPS Status & Card */
        .gps-status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 999px;
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 14px;
        }
        .gps-status-pill.is-verified {
            background: rgba(48, 209, 88, 0.15);
            border: 1px solid rgba(48, 209, 88, 0.4);
            color: #30d158;
        }
        .gps-status-pill.is-locked {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #ff7b7b;
        }
        .gps-locked-card {
            background: rgba(10, 14, 22, 0.75);
            border: 1px solid rgba(84, 232, 255, 0.4);
            border-radius: 20px;
            padding: 20px 18px;
            margin: 16px 0;
            text-align: center;
        }
        .gps-distance-text {
            font-size: 13px;
            color: var(--text-main);
            margin: 8px 0 4px;
            line-height: 1.45;
        }
        .gps-preview-cta {
            display: block;
            width: 100%;
            margin: 14px 0 8px;
            padding: 12px 20px;
            border-radius: 999px;
            background: linear-gradient(135deg, #ffd043, #ff9f1c);
            border: none;
            color: #11141d;
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 18px rgba(255, 175, 0, 0.35);
            transition: all 0.2s ease;
        }
        .gps-retry-btn {
            margin-top: 6px;
            padding: 7px 16px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        /* Remote Preview Floating Watermark */
        .preview-watermark-hud {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 18px;
            border-radius: 999px;
            background: rgba(10, 24, 38, 0.94);
            border: 1px solid rgba(84, 232, 255, 0.55);
            box-shadow: 0 4px 22px rgba(0, 0, 0, 0.5), 0 0 16px var(--accent-glow);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            color: var(--accent-cyan);
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.04em;
            pointer-events: none;
            animation: watermark-pulse 3s infinite ease-in-out;
        }
        @keyframes watermark-pulse {
            0%, 100% { opacity: 0.92; transform: translateX(-50%) scale(1); }
            50% { opacity: 1; transform: translateX(-50%) scale(1.02); }
        }
    </style>
</head>
<body>

    <!-- Permission & Proximity Screen -->
    <div id="permission-screen" class="permission-screen">
        <section class="permission-card">
            <div style="display:flex; justify-content:center; margin-bottom: 16px;" id="perm-lang-container"></div>
            <div id="gps-status-container"></div>
            <p class="eyebrow" style="color:var(--accent-cyan);" data-i18n="ar_protocol">AR / SWUP PROTOCOL</p>
            <h1 id="loading-title">Loading Team Stage...</h1>
            <p class="permission-copy" data-i18n="permission_hint">Enable your camera to project the team constellation into your space.</p>
            <p id="permission-error" style="color:#ff7b7b; display:none; margin-bottom:14px;"></p>
            <div id="gps-action-area">
                <button id="start-btn" class="primary-cta-btn" style="display:none;" data-i18n="enable_camera">Enable camera ↗</button>
            </div>
        </section>
    </div>

    <!-- Main Spatial Stage -->
    <div id="ar-stage" class="ar-stage" style="display:none;">
        <video id="camera-feed" class="camera-feed" muted playsinline></video>
        <div class="stage-backdrop"></div>
        <div class="scanlines"></div>

        <header class="top-hud">
            <div class="brand-lockup">
                <div class="brand-orb">✦</div>
                <div class="brand-text">
                    <p data-i18n="app_title">WALL OF FAME</p>
                    <h1 id="header-title">Team SWUP</h1>
                </div>
            </div>
            <div class="hud-controls">
                <div id="hud-lang-container"></div>
                <div class="tracking-pill"><i></i><span data-i18n="tracking_online">ROOM ANCHORED</span></div>
            </div>
        </header>

        <main class="main-stage">
            <div class="stage-banner">
                <h2 id="header-desc">One team.<br><em>Full momentum.</em></h2>
                <p id="header-subtitle">WINNER SIGNAL / 01</p>
            </div>

            <div class="constellation-wrapper" id="constellation-container">
                <!-- Injected via JavaScript -->
            </div>
        </main>
    </div>

    <script>
        let locData = {};
        let teamDestination = "";

        const permissionScreen = document.getElementById('permission-screen');
        const startBtn = document.getElementById('start-btn');
        const errorMsg = document.getElementById('permission-error');
        const videoEl = document.getElementById('camera-feed');
        const arStage = document.getElementById('ar-stage');

        // Inject language switchers
        document.getElementById('perm-lang-container').innerHTML = i18n.createSwitcherHTML();
        document.getElementById('hud-lang-container').innerHTML = i18n.createSwitcherHTML();

        i18n.subscribe(() => {
            updateHeaderTitles();
            if (typeof renderGpsLockedCard === 'function') renderGpsLockedCard();
            if (typeof updatePreviewWatermark === 'function') updatePreviewWatermark();
            renderConstellation();
        });

        function updateHeaderTitles() {
            if (!locData || !locData.id) return;
            const title = i18n.getLocalized(locData, 'title') || locData.title || locData.name;
            const subtitle = i18n.getLocalized(locData, 'subtitle') || locData.subtitle || "";

            document.getElementById('header-title').textContent = title;
            document.getElementById('header-desc').innerHTML = title.replace('\n', '<br><em>') + '</em>';
            document.getElementById('header-subtitle').textContent = subtitle;
        }

        async function fetchLocationData() {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                let locId = urlParams.get('id') || window.location.pathname.split('/').pop();
                if (!locId || locId === 'swup-v2.html' || locId === 'swup.html') locId = 'team-swup';

                const res = await fetch(`/api/locations/${locId}`);
                if (!res.ok) throw new Error("Location not found");

                locData = await res.json();
                updateHeaderTitles();
                teamDestination = locData.data?.teamDestination || "#";

                renderConstellation();
                await verifyGpsLocation();
            } catch (err) {
                locData = {
                    id: "team-swup",
                    title: "One team.\nFull momentum.",
                    subtitle: "WINNER SIGNAL / 01",
                    data: {
                        teamName: "TEAM SWUP",
                        teamPhoto: "https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=800&q=80",
                        teamDestination: "https://df-virtual-cards.vercel.app",
                        members: [
                            { id: "pranika", name: "Pranika", role: "Design Lead", specialty: "UX & Prototyping", accent: "#54e8ff" },
                            { id: "shiv", name: "Shiv", role: "Tech Lead", specialty: "Full-Stack AR", accent: "#ffd043" }
                        ]
                    }
                };
                renderConstellation();
                await verifyGpsLocation();
            }
        }

        function resolvePhotoUrl(photoPath) {
            if (!photoPath) return '';
            if (photoPath.startsWith('data:') || photoPath.startsWith('blob:') || photoPath.startsWith('http://') || photoPath.startsWith('https://')) {
                return photoPath;
            }
            const cleanPath = photoPath.replace(/^\/?(uploads\/)?/, '');
            if (window.location.protocol === 'file:') {
                return `../uploads/${cleanPath}`;
            }
            if (window.location.hostname.includes('vercel.app')) {
                return `https://vbscjdjzisdyohurjsro.supabase.co/storage/v1/object/public/images/uploads/${cleanPath}`;
            }
            return `/uploads/${cleanPath}`;
        }

        function handlePhotoError(img, fallbackText) {
            const raw = img.getAttribute('data-raw-src') || img.src || '';
            const clean = raw.replace(/^.*\/uploads\//, '').replace(/^.*[\\\/]/, '');
            if (!img.dataset.triedRel && clean) {
                img.dataset.triedRel = '1';
                img.src = `../uploads/${clean}`;
                return;
            }
            if (!img.dataset.triedCdn && clean) {
                img.dataset.triedCdn = '1';
                img.src = `https://vbscjdjzisdyohurjsro.supabase.co/storage/v1/object/public/images/uploads/${clean}`;
                return;
            }
            img.style.display = 'none';
        }

        function renderConstellation() {
            if (!locData || !locData.data) return;
            const container = document.getElementById('constellation-container');
            const data = locData.data;
            const teamName = i18n.getLocalized(data, 'teamName') || data.teamName || "SWUP";
            const teamPhotoRaw = data.teamPhoto || "https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=800&q=80";
            const teamPhoto = resolvePhotoUrl(teamPhotoRaw);
            const members = data.members || [];

            let html = `
                <div class="hub-node" onclick="projectTeam()">
                    <div class="hub-photo-frame">
                        <img src="${teamPhoto}" alt="${teamName}" onerror="handlePhotoError(this)">
                    </div>
                    <div class="hub-title">${teamName}</div>
                    <div class="hub-subtitle">${members.length} ${i18n.t('team_members')} · TRANSMISSION READY ↗</div>
                </div>
                <div class="constellation-struts">
                    <div class="strut-stem"></div>
                    <div class="strut-bar"></div>
                </div>
                <div class="members-grid">
            `;

            members.forEach((m, i) => {
                const role = i18n.getLocalized(m, 'role') || m.role || 'Maker';
                const specialty = i18n.getLocalized(m, 'specialty') || m.specialty || '';
                let initials = m.name ? m.name.substring(0, 2).toUpperCase() : 'SW';
                const memberPhoto = resolvePhotoUrl(m.photo);

                html += `
                    <div class="member-card-v2" style="--member-accent: ${m.accent || '#54e8ff'}" onclick="openMemberCard('${m.id || m.name}')">
                        <div class="member-portrait-frame">
                            <span>${initials}</span>
                            ${memberPhoto ? `<img src="${memberPhoto}" alt="${m.name}" onerror="handlePhotoError(this)">` : ''}
                        </div>
                        <div class="member-name">${m.name}</div>
                        <div class="member-role">${role}</div>
                        ${specialty ? `<div class="member-specialty">${specialty}</div>` : ''}
                    </div>
                `;
            });

            html += `</div>`;
            container.innerHTML = html;
        }

        function projectTeam() {
            if (teamDestination && teamDestination !== '#') {
                window.open(teamDestination, '_blank');
            }
        }

        function openMemberCard(memberId) {
            const dest = `https://df-virtual-cards.vercel.app?member=${encodeURIComponent(memberId)}`;
            window.open(dest, '_blank');
        }

        /* ── GPS Geofence & Proximity Check ── */
        function calculateDistanceMeters(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const phi1 = lat1 * Math.PI / 180, phi2 = lat2 * Math.PI / 180;
            const dp = (lat2 - lat1) * Math.PI / 180, dl = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dp/2)**2 + Math.cos(phi1)*Math.cos(phi2)*Math.sin(dl/2)**2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        const GEOFENCE_RADIUS = 8;
        let isGpsVerified = false, isRemotePreviewActive = false, detectedDistanceStr = '', lastGpsState = null;

        function updatePreviewWatermark() {
            const watermark = document.getElementById('preview-watermark-hud');
            if (watermark && isRemotePreviewActive) {
                const distText = detectedDistanceStr || 'REMOTE';
                watermark.innerHTML = `<span>⚡</span> ${i18n.t('gps_preview_active_banner', { dist: distText })}`;
            }
        }

        function renderGpsLockedCard() {
            if (!lastGpsState) return;
            const sc = document.getElementById('gps-status-container'), aa = document.getElementById('gps-action-area');
            let card = document.getElementById('gps-locked-card');

            if (lastGpsState.type === 'verified') {
                sc.innerHTML = `<div class="gps-status-pill is-verified">${i18n.t('gps_verified')} (${lastGpsState.distFormatted})</div>`;
                if (startBtn) startBtn.style.display = 'inline-block';
                if (card) card.remove();
                return;
            }
            if (lastGpsState.type === 'preview_badge') {
                sc.innerHTML = `<div class="gps-status-pill is-verified">${i18n.t('gps_preview_badge')}</div>`;
                if (startBtn) startBtn.style.display = 'inline-block';
                if (card) card.remove();
                return;
            }
            if (lastGpsState.type === 'locked' || lastGpsState.type === 'denied') {
                const isDenied = lastGpsState.type === 'denied';
                sc.innerHTML = `<div class="gps-status-pill is-locked">📍 ${lastGpsState.distFormatted || 'REMOTE'}</div>`;
                if (!card) {
                    card = document.createElement('div');
                    card.id = 'gps-locked-card';
                    card.className = 'gps-locked-card';
                    aa.parentNode.insertBefore(card, aa);
                }
                card.innerHTML = `
                    <div class="gps-status-pill is-locked" style="margin-bottom:8px;">📍 ${i18n.t(isDenied ? 'gps_required_title' : 'gps_not_at_location_title')}</div>
                    <p class="gps-distance-text">${isDenied ? i18n.t('gps_permission_denied') : i18n.t('gps_distance_away_msg', { dist: `<strong>${lastGpsState.distFormatted}</strong>` })}</p>
                    <p style="font-size:12px;color:rgba(255,255,255,.72);">${i18n.t('gps_preview_prompt')}</p>
                    <button class="gps-preview-cta" onclick="enterPreviewMode()">${i18n.t('gps_enter_preview_btn')}</button>
                    <div><button class="gps-retry-btn" onclick="verifyGpsLocation()">${i18n.t('gps_retry_btn')}</button></div>
                `;
            }
        }

        window.enterPreviewMode = function() { startExperience(true); };
        window.verifyGpsLocation = verifyGpsLocation;

        async function verifyGpsLocation() {
            const urlParams = new URLSearchParams(window.location.search);
            const statusContainer = document.getElementById('gps-status-container');
            const targetLat = parseFloat(locData.lat), targetLng = parseFloat(locData.lng);

            if (urlParams.get('bypass_gps') === '1' || urlParams.get('preview') === '1' || urlParams.get('admin') === '1') {
                isGpsVerified = true;
                isRemotePreviewActive = true;
                detectedDistanceStr = 'PREVIEW';
                lastGpsState = { type: 'preview_badge' };
                renderGpsLockedCard();
                return;
            }

            if (!targetLat || !targetLng || (targetLat === 0 && targetLng === 0)) {
                isGpsVerified = true;
                isRemotePreviewActive = false;
                lastGpsState = null;
                if (statusContainer) statusContainer.innerHTML = '';
                if (startBtn) startBtn.style.display = 'inline-block';
                return;
            }

            if (!navigator.geolocation) {
                lastGpsState = { type: 'denied', distFormatted: 'REMOTE' };
                renderGpsLockedCard();
                return;
            }

            statusContainer.innerHTML = `<div class="gps-status-pill">📡 ${i18n.t('gps_checking')}</div>`;
            if (startBtn) startBtn.style.display = 'none';

            navigator.geolocation.getCurrentPosition(
                pos => {
                    const dist = calculateDistanceMeters(targetLat, targetLng, pos.coords.latitude, pos.coords.longitude);
                    const distFormatted = dist < 1000 ? `${Math.round(dist)}m` : `${(dist/1000).toFixed(2)} km`;
                    detectedDistanceStr = distFormatted;

                    if (dist <= GEOFENCE_RADIUS) {
                        isGpsVerified = true;
                        isRemotePreviewActive = false;
                        lastGpsState = { type: 'verified', distFormatted };
                    } else {
                        isGpsVerified = false;
                        lastGpsState = { type: 'locked', distFormatted };
                    }
                    renderGpsLockedCard();
                },
                () => {
                    detectedDistanceStr = 'REMOTE';
                    lastGpsState = { type: 'denied', distFormatted: 'REMOTE' };
                    renderGpsLockedCard();
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        async function startExperience(remote) {
            if (remote) isRemotePreviewActive = true;
            if (isRemotePreviewActive) {
                let w = document.getElementById('preview-watermark-hud');
                if (!w) {
                    w = document.createElement('div');
                    w.id = 'preview-watermark-hud';
                    w.className = 'preview-watermark-hud';
                    document.body.appendChild(w);
                }
                w.innerHTML = `<span>⚡</span> PREVIEW MODE · ${detectedDistanceStr || 'REMOTE'}`;
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                videoEl.srcObject = stream;
                videoEl.onloadedmetadata = () => {
                    videoEl.play();
                    permissionScreen.style.display = 'none';
                    arStage.style.display = 'block';
                    setTimeout(() => videoEl.classList.add('is-ready'), 140);
                };
            } catch (e) {
                permissionScreen.style.display = 'none';
                arStage.style.display = 'block';
            }
        }

        document.getElementById('start-btn').addEventListener('click', () => startExperience(isRemotePreviewActive));

        fetchLocationData();
    </script>
</body>
</html>
