<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>RTU Wall of Fame - Premium AR</title>
    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <!-- AR.js for GPS based AR -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <style>
        #ui-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 10;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 20px; box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }
        .hud-header {
            background: rgba(0, 0, 0, 0.7);
            color: #d4af37;
            padding: 15px; border-radius: 8px;
            backdrop-filter: blur(10px);
            text-align: center; pointer-events: auto;
            border: 1px solid rgba(212, 175, 55, 0.3);
        }
        .hud-header h1 { margin: 0 0 5px 0; font-size: 1.2rem; }
        .hud-header p { margin: 0; font-size: 0.9rem; color: #fff; }
        .status {
            background: rgba(0, 0, 0, 0.7); color: #fff;
            padding: 10px; border-radius: 8px; font-size: 0.8rem;
            align-self: center; margin-bottom: 20px;
        }
    </style>
</head>
<body style="margin: 0; overflow: hidden;">

    <div id="ui-layer">
        <div class="hud-header">
            <h1>RTU Hall of Fame AR</h1>
            <p>Point your camera towards campus locations.</p>
        </div>
        <div class="status" id="status-text">Fetching locations...</div>
    </div>

    <a-scene 
        vr-mode-ui="enabled: false"
        embedded
        arjs="sourceType: webcam; debugUIEnabled: false; gpsMinDistance: 1;"
        renderer="colorManagement: true; physicallyCorrectLights: true; shadowMapType: pcfsoft;">
        
        <a-assets>
            <img id="glass-tex" src="https://images.unsplash.com/photo-1550605651-7871b601f787?ixlib=rb-4.0.3&auto=format&fit=crop&w=512&q=80" crossorigin="anonymous"> 
        </a-assets>

        <a-camera gps-camera rotation-reader></a-camera>

        <!-- Realistic Lighting for Physical Shading and Shadows -->
        <a-entity light="type: ambient; color: #FFF; intensity: 0.6"></a-entity>
        <a-entity light="type: directional; color: #FFF; intensity: 1.2; castShadow: true; shadowMapHeight: 2048; shadowMapWidth: 2048; shadowBias: -0.001" position="-1 3 2"></a-entity>

        <!-- Dynamic Content Container -->
        <a-entity id="ar-container"></a-entity>
    </a-scene>

    <script>
        const arContainer = document.getElementById('ar-container');
        const statusText = document.getElementById('status-text');
        const uiLayer = document.getElementById('ui-layer');

        function getDistanceInMeters(lat1, lon1, lat2, lon2) {
            const R = 6371e3; // metres
            const φ1 = lat1 * Math.PI/180;
            const φ2 = lat2 * Math.PI/180;
            const Δφ = (lat2-lat1) * Math.PI/180;
            const Δλ = (lon2-lon1) * Math.PI/180;
            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2) * Math.sin(Δλ/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        async function initAR() {
            try {
                statusText.innerHTML = "Getting your precise location...";

                navigator.geolocation.getCurrentPosition(async (pos) => {
                    const userLat = pos.coords.latitude;
                    const userLng = pos.coords.longitude;
                    const accuracy = pos.coords.accuracy;
                    const maxDistanceMeters = Math.max(14.63, accuracy);

                    const response = await fetch('/api/locations');
                    const locations = await response.json();
                    
                    let loadedCount = 0;
                    let closestDistance = Infinity;
                    let closestName = "";

                    for (const locStub of locations) {
                        const locResponse = await fetch(`/api/locations/${locStub.id}`);
                        const locData = await locResponse.json();

                        if(locData.lat && locData.lng) {
                            const distance = getDistanceInMeters(userLat, userLng, locData.lat, locData.lng);
                            
                            if (distance < closestDistance) {
                                closestDistance = distance;
                                closestName = locData.name;
                            }
                            
                            if (distance <= maxDistanceMeters) {
                                createWallForLocation(locData);
                                loadedCount++;
                            }
                        }
                    }

                    if (loadedCount > 0) {
                        // Hide UI entirely for total immersion as requested!
                        uiLayer.style.display = 'none';
                    } else {
                        const closestFt = Math.round(closestDistance * 3.28084);
                        statusText.innerHTML = `No Wall of Fame found within 48 feet.<br>
                        <small>Closest is <b>${closestName}</b> (${closestFt} feet away).</small><br>
                        <small style="color:#ffaaaa">Your GPS: ${userLat.toFixed(5)}, ${userLng.toFixed(5)} (Accuracy: ±${Math.round(accuracy)}m)</small>`;
                    }
                }, (err) => {
                    console.error("Geolocation error:", err);
                    statusText.textContent = "Please allow location access to find nearby Walls of Fame.";
                }, {
                    enableHighAccuracy: true,
                    maximumAge: 0,
                    timeout: 10000
                });
                
            } catch (err) {
                console.error(err);
                statusText.textContent = "Error loading data. Is the server running?";
            }
        }

        function createWallForLocation(loc) {
            const anchor = document.createElement('a-entity');
            anchor.setAttribute('gps-entity-place', `latitude: ${loc.lat}; longitude: ${loc.lng};`);
            anchor.setAttribute('position', '0 1.5 0');
            anchor.setAttribute('look-at', '[gps-camera]');

            const wallWidth = 14;
            const wallHeight = 4.5;
            
            // Glassmorphism Main Board (Floating transparent UI)
            const board = document.createElement('a-box');
            board.setAttribute('width', wallWidth);
            board.setAttribute('height', wallHeight);
            board.setAttribute('depth', '0.05');
            // Faking glass: semi-transparent, highly reflective
            board.setAttribute('material', 'color: #ffffff; opacity: 0.15; transparent: true; roughness: 0.1; metalness: 0.8');
            board.setAttribute('position', `0 ${wallHeight/2} 0`);
            
            // Subtle glowing border for the glass panel
            const border = document.createElement('a-box');
            border.setAttribute('width', wallWidth + 0.04);
            border.setAttribute('height', wallHeight + 0.04);
            border.setAttribute('depth', '0.04');
            border.setAttribute('material', 'color: #ffffff; opacity: 0.3; transparent: true');
            border.setAttribute('position', '0 0 0');
            board.appendChild(border);

            // Title (Sleek, modern, top-aligned)
            const titleContainer = document.createElement('a-entity');
            titleContainer.setAttribute('position', `-6.2 ${wallHeight/2 - 0.4} 0.05`);
            
            const title = document.createElement('a-text');
            title.setAttribute('value', loc.title);
            title.setAttribute('color', '#ffffff');
            title.setAttribute('width', '14');
            title.setAttribute('font', 'roboto');
            titleContainer.appendChild(title);

            const subtitle = document.createElement('a-text');
            subtitle.setAttribute('value', loc.subtitle.toUpperCase() + ' · SPATIAL VIEW');
            subtitle.setAttribute('color', 'rgba(255,255,255,0.7)');
            subtitle.setAttribute('width', '6');
            subtitle.setAttribute('font', 'roboto');
            subtitle.setAttribute('position', '0 -0.4 0');
            titleContainer.appendChild(subtitle);
            
            board.appendChild(titleContainer);

            // Right Section: Grid of Circular Avatars (V2 style)
            if(loc.inductees && loc.inductees.length > 0) {
                const gridStartX = -2.5;
                const gridStartY = 1.0;
                const colSpacing = 1.8;
                const rowSpacing = 2.0;
                const maxCols = 5;

                loc.inductees.forEach((inductee, index) => {
                    const col = index % maxCols;
                    const row = Math.floor(index / maxCols);
                    
                    const xPos = gridStartX + (col * colSpacing);
                    const yPos = gridStartY - (row * rowSpacing);
                    
                    const avatarNode = document.createElement('a-entity');
                    avatarNode.setAttribute('position', `${xPos} ${yPos} 0.1`);

                    // Circular Avatar
                    if(inductee.image) {
                        // Glass backing circle
                        const avatarBase = document.createElement('a-cylinder');
                        avatarBase.setAttribute('radius', '0.6');
                        avatarBase.setAttribute('height', '0.02');
                        avatarBase.setAttribute('rotation', '90 0 0');
                        avatarBase.setAttribute('material', 'color: #ffffff; opacity: 0.2; transparent: true');
                        avatarBase.setAttribute('position', '0 0 0');
                        
                        // Image circle
                        const imgNode = document.createElement('a-cylinder');
                        imgNode.setAttribute('radius', '0.55');
                        imgNode.setAttribute('height', '0.01');
                        imgNode.setAttribute('material', `src: ${inductee.image}; roughness: 1`);
                        imgNode.setAttribute('position', '0 0.015 0'); // Front face of the cylinder
                        avatarBase.appendChild(imgNode);
                        
                        // Accent ring (glow)
                        const ring = document.createElement('a-ring');
                        ring.setAttribute('radius-inner', '0.61');
                        ring.setAttribute('radius-outer', '0.64');
                        ring.setAttribute('material', 'color: #92b7e5; opacity: 0.8; transparent: true');
                        ring.setAttribute('position', '0 0.01 0');
                        avatarBase.appendChild(ring);

                        avatarNode.appendChild(avatarBase);
                    }

                    // Floating text below avatar
                    const nameTxt = document.createElement('a-text');
                    nameTxt.setAttribute('value', inductee.name);
                    nameTxt.setAttribute('color', '#ffffff');
                    nameTxt.setAttribute('align', 'center');
                    nameTxt.setAttribute('width', '3');
                    nameTxt.setAttribute('font', 'roboto');
                    nameTxt.setAttribute('position', '0 -0.8 0');
                    avatarNode.appendChild(nameTxt);

                    const awardTxt = document.createElement('a-text');
                    awardTxt.setAttribute('value', inductee.award);
                    awardTxt.setAttribute('color', 'rgba(255,255,255,0.7)');
                    awardTxt.setAttribute('align', 'center');
                    awardTxt.setAttribute('width', '1.8');
                    awardTxt.setAttribute('font', 'roboto');
                    awardTxt.setAttribute('position', '0 -1.0 0');
                    avatarNode.appendChild(awardTxt);

                    board.appendChild(avatarNode);
                });
            }

            anchor.appendChild(board);
            arContainer.appendChild(anchor);
        }

        AFRAME.registerComponent('look-at', {
            schema: { type: 'selector' },
            tick: function () {
                if (!this.data) return;
                const targetPos = new THREE.Vector3();
                this.data.object3D.getWorldPosition(targetPos);
                this.el.object3D.lookAt(targetPos.x, this.el.object3D.position.y, targetPos.z);
            }
        });

        initAR();
    </script>
</body>
</html>
