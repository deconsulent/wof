<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTU Wall of Fame - Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin.css">
</head>
<body>

    <div class="admin-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Admin Panel</h2>
                <p>Manage Locations</p>
            </div>
            <ul class="location-list" id="location-list">
                <!-- Location list will be injected here -->
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="main-content" id="main-content" style="display: none;">
            <header class="main-header">
                <h1 id="editor-title">Editing: Location Name</h1>
                <button class="btn btn-primary" id="save-btn">Save Changes</button>
            </header>

            <div class="editor-grid">
                <!-- General Settings -->
                <section class="card">
                    <h2>General Information</h2>
                    <div class="form-group">
                        <label>Title</label>
                        <input type="text" id="loc-title" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Subtitle</label>
                        <input type="text" id="loc-subtitle" class="form-control">
                    </div>
                    <div class="form-group" style="display: flex; gap: 1rem;">
                        <div style="flex: 1;">
                            <label>Latitude</label>
                            <input type="number" step="any" id="loc-lat" class="form-control">
                        </div>
                        <div style="flex: 1;">
                            <label>Longitude</label>
                            <input type="number" step="any" id="loc-lng" class="form-control">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <textarea id="loc-desc" class="form-control" rows="3"></textarea>
                    </div>
                </section>

                <!-- Inductees -->
                <section class="card">
                    <div class="card-header">
                        <h2>Inductees</h2>
                        <button class="btn btn-secondary btn-sm" id="add-inductee-btn">+ Add Inductee</button>
                    </div>
                    <div class="inductee-list" id="inductee-list">
                        <!-- Inductee items will be injected here -->
                    </div>
                </section>
            </div>
        </main>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="toast">Saved Successfully!</div>

    <script>
        let currentLocationId = null;
        let currentLocationData = null;

        // Fetch locations on load
        fetch('/api/locations')
            .then(res => res.json())
            .then(locations => {
                const list = document.getElementById('location-list');
                locations.forEach(loc => {
                    const li = document.createElement('li');
                    li.textContent = loc.name;
                    li.className = 'location-item';
                    li.addEventListener('click', () => loadLocation(loc.id, li));
                    list.appendChild(li);
                });
                // Load first location automatically
                if(locations.length > 0) {
                    loadLocation(locations[0].id, list.firstChild);
                }
            });

        function loadLocation(id, element) {
            // Update active state in sidebar
            document.querySelectorAll('.location-item').forEach(el => el.classList.remove('active'));
            if(element) element.classList.add('active');

            currentLocationId = id;
            fetch(`/api/locations/${id}`)
                .then(res => res.json())
                .then(data => {
                    currentLocationData = data;
                    document.getElementById('main-content').style.display = 'block';
                    document.getElementById('editor-title').textContent = `Editing: ${data.name}`;
                    
                    document.getElementById('loc-title').value = data.title;
                    document.getElementById('loc-subtitle').value = data.subtitle;
                    document.getElementById('loc-desc').value = data.description;
                    document.getElementById('loc-lat').value = data.lat || '';
                    document.getElementById('loc-lng').value = data.lng || '';

                    renderInductees();
                });
        }

        function renderInductees() {
            const list = document.getElementById('inductee-list');
            list.innerHTML = '';
            
            currentLocationData.inductees.forEach((inductee, index) => {
                const div = document.createElement('div');
                div.className = 'inductee-item';
                div.innerHTML = `
                    <div class="inductee-header">
                        <h4>Inductee #${index + 1}</h4>
                        <button class="btn btn-danger btn-sm" onclick="removeInductee(${index})">Remove</button>
                    </div>
                    <div class="form-group">
                        <label>Name</label>
                        <input type="text" class="form-control" value="${inductee.name}" onchange="updateInductee(${index}, 'name', this.value)">
                    </div>
                    <div class="form-group">
                        <label>Award</label>
                        <input type="text" class="form-control" value="${inductee.award}" onchange="updateInductee(${index}, 'award', this.value)">
                    </div>
                    <div class="form-group">
                        <label>Image URL</label>
                        <input type="text" class="form-control" value="${inductee.image}" onchange="updateInductee(${index}, 'image', this.value)">
                    </div>
                    <div class="form-group">
                        <label>Bio</label>
                        <textarea class="form-control" rows="2" onchange="updateInductee(${index}, 'bio', this.value)">${inductee.bio}</textarea>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        window.removeInductee = (index) => {
            currentLocationData.inductees.splice(index, 1);
            renderInductees();
        };

        window.updateInductee = (index, field, value) => {
            currentLocationData.inductees[index][field] = value;
        };

        document.getElementById('add-inductee-btn').addEventListener('click', () => {
            currentLocationData.inductees.push({
                id: Date.now(),
                name: "New Inductee",
                award: "New Award",
                image: "images/portrait_1.jpg",
                bio: "Enter biography..."
            });
            renderInductees();
        });

        document.getElementById('save-btn').addEventListener('click', () => {
            if(!currentLocationData) return;

            // Gather general info
            currentLocationData.title = document.getElementById('loc-title').value;
            currentLocationData.subtitle = document.getElementById('loc-subtitle').value;
            currentLocationData.description = document.getElementById('loc-desc').value;
            currentLocationData.lat = parseFloat(document.getElementById('loc-lat').value) || 0;
            currentLocationData.lng = parseFloat(document.getElementById('loc-lng').value) || 0;

            // Save via API
            fetch(`/api/locations/${currentLocationId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(currentLocationData)
            })
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    showToast();
                }
            });
        });

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 3000);
        }
    </script>
</body>
</html>
