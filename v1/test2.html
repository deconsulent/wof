<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>RTU Wall of Fame - V2 Design in 3D AR (True Glassmorphism)</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; overscroll-behavior-y: contain; touch-action: none; 
            font-family: 'Inter', sans-serif; background-color: #000; 
        }
        
        #ui-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 10;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 20px; box-sizing: border-box;
        }

        .header-bar {
            max-width: 1120px; padding: 13px 17px 13px 21px; margin: 0 auto 17px; 
            border-radius: 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
            background: rgba(255,255,255,0.15); backdrop-filter: blur(38px) saturate(1.55); border: 1px solid rgba(255,255,255,0.47); pointer-events: auto;
        }

        #drag-hint {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            font-size: 12px; color: #fff;
            background: rgba(0, 0, 0, 0.6); padding: 10px 20px; border-radius: 20px;
            pointer-events: none; text-align: center; line-height: 1.5; z-index: 5;
        }

        #loading-screen {
            position: fixed; inset: 0; z-index: 50; display: grid; place-items: center;
            background: radial-gradient(circle at 50% 15%, #5a6688, #171b27 72%); color: white;
            padding: 24px; transition: opacity 0.5s;
        }

        .glass-box {
            max-width: 410px; padding: 30px; border-radius: 30px; text-align: center;
            background: rgba(255,255,255,0.15); backdrop-filter: blur(38px) saturate(1.55); border: 1px solid rgba(255,255,255,0.47);
        }
    </style>

    <script>
        // NEW: Custom System for extracting and blurring the camera feed
        AFRAME.registerSystem('glass-engine', {
            init: function () {
                this.renderer = this.el.sceneEl.renderer;
                // Create a low-res target for the blur pass
                this.renderTarget = new THREE.WebGLRenderTarget(256, 256, { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter });
                window.GlassBlurTexture = this.renderTarget.texture;
                
                this.blurCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
                this.blurScene = new THREE.Scene();
                
                this.blurMaterial = new THREE.ShaderMaterial({
                    uniforms: { tDiffuse: { value: null } },
                    vertexShader: `
                        varying vec2 vUv;
                        void main() { vUv = uv; gl_Position = vec4(position, 1.0); }
                    `,
                    fragmentShader: `
                        uniform sampler2D tDiffuse;
                        varying vec2 vUv;
                        void main() {
                            vec4 color = vec4(0.0);
                            vec2 texel = vec2(1.0 / 256.0);
                            // 9-tap blur with wide spread
                            for(float x = -2.0; x <= 2.0; x += 2.0) {
                                for(float y = -2.0; y <= 2.0; y += 2.0) {
                                    color += texture2D(tDiffuse, vUv + vec2(x, y) * texel * 1.5);
                                }
                            }
                            gl_FragColor = color / 9.0;
                        }
                    `
                });
                
                const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.blurMaterial);
                this.blurScene.add(quad);
            },
            tick: function () {
                if (!this.videoTexture) {
                    const videoEl = document.querySelector('#arjs-video') || document.querySelector('video');
                    if (videoEl && videoEl.readyState >= 2) { 
                        this.videoTexture = new THREE.VideoTexture(videoEl);
                        this.blurMaterial.uniforms.tDiffuse.value = this.videoTexture;
                    }
                }
                
                if (this.videoTexture) {
                    const oldTarget = this.renderer.getRenderTarget();
                    this.renderer.setRenderTarget(this.renderTarget);
                    this.renderer.render(this.blurScene, this.blurCamera);
                    this.renderer.setRenderTarget(oldTarget);
                    
                    // Notify any materials that haven't received the texture yet
                    document.querySelectorAll('[material]').forEach(el => {
                        const matAttr = el.getAttribute('material');
                        if (matAttr && matAttr.shader === 'glass') {
                            const mesh = el.getObject3D('mesh');
                            if (mesh && mesh.material && mesh.material.uniforms && !mesh.material.uniforms.tBlur.value) {
                                mesh.material.uniforms.tBlur.value = this.renderTarget.texture;
                            }
                        }
                    });
                }
            }
        });

        // NEW: Custom Shader for the glass panels
        AFRAME.registerShader('glass', {
            schema: {
                color: {type: 'color', is: 'uniform', default: '#ffffff'},
                opacity: {type: 'number', is: 'uniform', default: 0.15}
            },
            vertexShader: `
                varying vec4 vScreenPos;
                void main() {
                    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                    gl_Position = projectionMatrix * mvPosition;
                    vScreenPos = gl_Position;
                }
            `,
            fragmentShader: `
                uniform vec3 color;
                uniform float opacity;
                uniform sampler2D tBlur;
                varying vec4 vScreenPos;
                
                void main() {
                    vec2 ndc = (vScreenPos.xy / vScreenPos.w);
                    vec2 screenUV = ndc * 0.5 + 0.5;
                    
                    vec4 bg = texture2D(tBlur, screenUV);
                    gl_FragColor = vec4(mix(bg.rgb, color, opacity), 1.0);
                }
            `,
            init: function (data) {
                this.material = new THREE.ShaderMaterial({
                    uniforms: {
                        color: { value: new THREE.Color(data.color) },
                        opacity: { value: data.opacity },
                        tBlur: { value: window.GlassBlurTexture || null }
                    },
                    vertexShader: this.vertexShader,
                    fragmentShader: this.fragmentShader
                });
            },
            update: function (data) {
                this.material.uniforms.color.value.set(data.color);
                this.material.uniforms.opacity.value = data.opacity;
            }
        });

        // V0 Mechanism: Keep wall facing user
        AFRAME.registerComponent('billboard-y', {
            tick: function () {
                const cameraEl = document.getElementById('camera');
                if (!cameraEl) return;
                const camPos = new THREE.Vector3();
                cameraEl.object3D.getWorldPosition(camPos);
                this.el.object3D.lookAt(camPos.x, this.el.object3D.position.y, camPos.z);
            }
        });

        // V0 Mechanism: Drag and Scale
        AFRAME.registerComponent('touch-manipulate', {
            init: function () {
                this.wall = document.getElementById('ar-container');
                this.camera = document.getElementById('camera');
                this.touchStart = { x: 0, y: 0 };
                this.initialDist = 0;
                this.isDragging = false;
                this.isPinching = false;

                document.addEventListener('touchstart', (e) => {
                    if (e.target.closest('.header-bar')) return;
                    if (e.touches.length === 1) {
                        this.isDragging = true; this.isPinching = false;
                        this.touchStart.x = e.touches[0].clientX; this.touchStart.y = e.touches[0].clientY;
                    } else if (e.touches.length === 2) {
                        this.isDragging = false; this.isPinching = true;
                        this.initialDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                    }
                }, { passive: false });

                document.addEventListener('touchmove', (e) => {
                    e.preventDefault(); 
                    if (this.isDragging && e.touches.length === 1) {
                        const deltaX = e.touches[0].clientX - this.touchStart.x;
                        const deltaY = e.touches[0].clientY - this.touchStart.y;
                        const s = 0.005; 
                        
                        const camRight = new THREE.Vector3(1, 0, 0);
                        camRight.applyQuaternion(this.camera.object3D.quaternion);
                        camRight.y = 0; 
                        if (camRight.lengthSq() > 0) camRight.normalize();

                        const camUp = new THREE.Vector3(0, 1, 0);
                        this.wall.object3D.position.add(camRight.multiplyScalar(deltaX * s));
                        this.wall.object3D.position.add(camUp.multiplyScalar(-deltaY * s));
                        
                        this.touchStart.x = e.touches[0].clientX; this.touchStart.y = e.touches[0].clientY;
                    } else if (this.isPinching && e.touches.length === 2) {
                        const currentDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                        if (this.initialDist > 0) {
                            const scaleDelta = currentDist / this.initialDist;
                            let newScale = this.wall.object3D.scale.x * scaleDelta;
                            if (newScale < 0.2) newScale = 0.2;
                            if (newScale > 5.0) newScale = 5.0;
                            this.wall.object3D.scale.set(newScale, newScale, newScale);
                        }
                        this.initialDist = currentDist;
                    }
                }, { passive: false });

                document.addEventListener('touchend', (e) => {
                    if (e.touches.length === 0) { this.isDragging = false; this.isPinching = false; }
                    else if (e.touches.length === 1) { this.isPinching = false; this.isDragging = true; this.touchStart.x = e.touches[0].clientX; this.touchStart.y = e.touches[0].clientY; }
                });
            }
        });
    </script>
</head>
<body>

    <div id="loading-screen">
        <div class="glass-box">
            <h1 id="status-title" style="margin: 0; font-size: 25px; letter-spacing: -.04em;">Initializing Space</h1>
            <p id="status-desc" style="color: rgba(255,255,255,.7); line-height: 1.55; font-size: 14px;">Acquiring AR tracking...</p>
            <button id="start-btn" style="display: none; padding: 12px 22px; color: white; background: rgba(255,255,255,0.2); cursor: pointer; border-radius: 99px; font-weight: 700; border: 1px solid rgba(255,255,255,0.4); margin-top: 15px;">Enable Camera</button>
        </div>
    </div>

    <div id="ui-layer" style="display: none;">
        <header class="header-bar">
            <div>
                <div style="color: white; font-size: 20px; font-weight: 700; letter-spacing: -.04em;">Organization map</div>
                <div id="location-subtitle" style="color: rgba(255,255,255,.63); font-size: 10.5px; margin-top: 3px;">Wall of Fame · Spatial View</div>
            </div>
            <div style="display: flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 99px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.3); color: rgba(255,255,255,.82); font-size: 11px;">
                <i style="width: 7px; height: 7px; border-radius: 50%; background: #65e98a; box-shadow: 0 0 9px #65e98a;"></i> AR Live (Glass FX)
            </div>
        </header>
        <div id="drag-hint">
            [ 1 FINGER: DRAG ] &nbsp;|&nbsp; [ 2 FINGERS: PINCH SCALE ]
        </div>
    </div>

    <!-- A-Frame Scene (Enabled glass-engine) -->
    <a-scene 
        glass-engine
        touch-manipulate
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: true"
        loading-screen="enabled: false"
        arjs="sourceType: webcam; debugUIEnabled: false; videoTexture: true;"
        renderer="colorManagement: true; physicallyCorrectLights: true;">
        
        <a-entity id="camera" camera look-controls="pointerLockEnabled: false"></a-entity>

        <a-entity light="type: ambient; color: #FFF; intensity: 0.8"></a-entity>

        <!-- Main AR Container (Billboard to face user) -->
        <a-entity id="ar-container" visible="false" billboard-y></a-entity>
    </a-scene>

    <script>
        const arContainer = document.getElementById('ar-container');
        const statusTitle = document.getElementById('status-title');
        const statusDesc = document.getElementById('status-desc');
        const startBtn = document.getElementById('start-btn');
        const loadingScreen = document.getElementById('loading-screen');
        const uiLayer = document.getElementById('ui-layer');
        const cameraEl = document.getElementById('camera');

        const accents = ["#d865b5", "#92b7e5", "#ed947b", "#d1b357", "#b2b8d7", "#dc8d9b", "#d2a961", "#7c9aba", "#a18dc9"];

        function createGlassCard(person, isLead, index) {
            const width = isLead ? 1.7 : 1.4;
            const height = isLead ? 1.9 : 1.76;
            const accent = accents[index % accents.length];

            const card = document.createElement('a-entity');
            
            // Glass Backing - Using the new custom shader!
            const backing = document.createElement('a-plane');
            backing.setAttribute('width', width);
            backing.setAttribute('height', height);
            backing.setAttribute('material', 'shader: glass; color: #ffffff; opacity: 0.2');
            card.appendChild(backing);

            // Border
            const border = document.createElement('a-plane');
            border.setAttribute('width', width + 0.04);
            border.setAttribute('height', height + 0.04);
            border.setAttribute('position', '0 0 -0.01');
            border.setAttribute('material', `color: ${accent}; opacity: 0.3; transparent: true; shader: flat`);
            card.appendChild(border);

            // Circular Avatar
            const avatarY = isLead ? 0.3 : 0.2;
            const avatarRadius = isLead ? 0.4 : 0.35;
            
            const avatarRing = document.createElement('a-circle');
            avatarRing.setAttribute('radius', avatarRadius + 0.02);
            avatarRing.setAttribute('position', `0 ${avatarY} 0.01`);
            avatarRing.setAttribute('material', `color: ${accent}; opacity: 0.8; transparent: true; shader: flat`);
            card.appendChild(avatarRing);

            const avatarImage = document.createElement('a-circle');
            avatarImage.setAttribute('radius', avatarRadius);
            avatarImage.setAttribute('position', `0 ${avatarY} 0.02`);
            if (person.image) {
                avatarImage.setAttribute('material', `src: ${person.image}; shader: flat`);
            } else {
                avatarImage.setAttribute('material', `color: #4a5568; shader: flat`);
            }
            card.appendChild(avatarImage);

            // Text
            const nameY = isLead ? -0.4 : -0.3;
            const nameTxt = document.createElement('a-text');
            nameTxt.setAttribute('value', person.name);
            nameTxt.setAttribute('color', '#ffffff');
            nameTxt.setAttribute('align', 'center');
            nameTxt.setAttribute('width', isLead ? '3.5' : '3');
            nameTxt.setAttribute('position', `0 ${nameY} 0.02`);
            nameTxt.setAttribute('font', 'roboto');
            card.appendChild(nameTxt);

            const roleTxt = document.createElement('a-text');
            roleTxt.setAttribute('value', person.award || person.role || '');
            roleTxt.setAttribute('color', 'rgba(255,255,255,0.7)');
            roleTxt.setAttribute('align', 'center');
            roleTxt.setAttribute('width', '2');
            roleTxt.setAttribute('position', `0 ${nameY - 0.2} 0.02`);
            roleTxt.setAttribute('font', 'roboto');
            card.appendChild(roleTxt);

            return card;
        }

        function createTreeConstellation(loc) {
            arContainer.innerHTML = '';
            
            // Constellation Title
            const titleGroup = document.createElement('a-entity');
            titleGroup.setAttribute('position', '-2 3 0');
            
            const categoryText = document.createElement('a-text');
            categoryText.setAttribute('value', 'PEOPLE · HIERARCHY');
            categoryText.setAttribute('color', 'rgba(255,255,255,0.6)');
            categoryText.setAttribute('width', '3');
            categoryText.setAttribute('position', '0 0.4 0');
            categoryText.setAttribute('font', 'roboto');
            titleGroup.appendChild(categoryText);

            const titleText = document.createElement('a-text');
            titleText.setAttribute('value', 'Department Constellation');
            titleText.setAttribute('color', '#ffffff');
            titleText.setAttribute('width', '6');
            titleText.setAttribute('font', 'roboto');
            titleGroup.appendChild(titleText);
            
            arContainer.appendChild(titleGroup);

            if (!loc.inductees || loc.inductees.length === 0) return;

            // 1. Lead Node
            const leadNode = createGlassCard(loc.inductees[0], true, 0);
            leadNode.setAttribute('position', '0 1 0');
            arContainer.appendChild(leadNode);

            // Connectors & Report Nodes
            const reportCount = loc.inductees.length - 1;
            if (reportCount > 0) {
                const spacing = 1.6;
                const totalWidth = (reportCount - 1) * spacing;
                
                // Vertical Stem from Lead
                const stem = document.createElement('a-plane');
                stem.setAttribute('width', '0.02');
                stem.setAttribute('height', '0.6');
                stem.setAttribute('position', '0 -0.2 0'); // below lead node
                stem.setAttribute('material', 'color: rgba(255,255,255,0.3); shader: flat');
                arContainer.appendChild(stem);

                // Horizontal Connector Bar
                const hBar = document.createElement('a-plane');
                hBar.setAttribute('width', totalWidth + 0.02);
                hBar.setAttribute('height', '0.02');
                hBar.setAttribute('position', `0 -0.5 0`);
                hBar.setAttribute('material', 'color: rgba(255,255,255,0.3); shader: flat');
                arContainer.appendChild(hBar);

                // Report Nodes Row
                for (let i = 1; i < loc.inductees.length; i++) {
                    const xPos = -totalWidth/2 + (i-1) * spacing;
                    const yPos = -1.6;
                    
                    // Vertical Stem to Report
                    const rStem = document.createElement('a-plane');
                    rStem.setAttribute('width', '0.02');
                    rStem.setAttribute('height', '0.3');
                    rStem.setAttribute('position', `${xPos} -0.65 0`);
                    rStem.setAttribute('material', 'color: rgba(255,255,255,0.3); shader: flat');
                    arContainer.appendChild(rStem);

                    // Report Card
                    const reportNode = createGlassCard(loc.inductees[i], false, i);
                    reportNode.setAttribute('position', `${xPos} ${yPos} 0`);
                    arContainer.appendChild(reportNode);
                }
            }
        }

        async function startApp() {
            startBtn.style.display = 'none';
            statusTitle.textContent = "Loading AR Space...";
            statusDesc.textContent = "Please wait.";

            try {
                // Fetch mock test data (The Moon)
                const response = await fetch('/api/locations');
                const locations = await response.json();
                const stub = locations.find(l => l.id === 'the-moon') || locations[0];
                
                const locResponse = await fetch(`/api/locations/${stub.id}`);
                const locData = await locResponse.json();

                createTreeConstellation(locData);
                
                // Spawn EXACTLY 4 meters in front of the user's CURRENT camera view after a short delay
                setTimeout(() => {
                    const localSpawnPoint = new THREE.Vector3(0, 0, -4);
                    const worldSpawnPoint = cameraEl.object3D.localToWorld(localSpawnPoint);
                    worldSpawnPoint.y = cameraEl.object3D.position.y;
                    
                    arContainer.object3D.position.copy(worldSpawnPoint);
                    arContainer.setAttribute('visible', 'true');
                    
                    // Hide loading, show UI
                    loadingScreen.style.display = 'none';
                    uiLayer.style.display = 'flex';
                }, 1500); 

            } catch (err) {
                console.error(err);
                statusTitle.textContent = "Error";
                statusDesc.textContent = err.message;
            }
        }

        // Initialize on button click (requires user interaction for some browsers' media access)
        startBtn.style.display = 'inline-block';
        startBtn.addEventListener('click', startApp);

    </script>
</body>
</html>
