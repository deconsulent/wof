<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTU Wall of Fame</title>
    <!-- Premium Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="kiosk.css">
</head>
<body>

    <!-- Main Wall Container mimicking the physical wood/metal panel -->
    <main class="wall-container">
        
        <!-- Header Section -->
        <header class="wall-header">
            <h1 id="wall-title">Connecting...</h1>
            <p id="wall-subtitle">Connecting to central database</p>
            <div class="header-divider"></div>
            <p id="wall-description"></p>
        </header>

        <!-- Grid for Inductee Plaques -->
        <section class="plaque-grid" id="plaque-grid">
            <!-- Plaques will be injected here via JavaScript -->
        </section>

    </main>

    <!-- Modal for Detailed View -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-content">
            <button class="close-btn" id="close-btn">&times;</button>
            <div class="modal-layout">
                <img id="modal-image" src="" alt="Inductee Portrait">
                <div class="modal-info">
                    <h2 id="modal-name">Name</h2>
                    <h3 id="modal-award">Award</h3>
                    <div class="modal-divider"></div>
                    <p id="modal-bio">Biography goes here.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Get location from URL, default to 'design-factory' if none provided
            const urlParams = new URLSearchParams(window.location.search);
            const locationId = urlParams.get('location') || 'design-factory';
            
            const grid = document.getElementById('plaque-grid');
            let lastDataString = "";

            function fetchData() {
                fetch(`/api/locations/${locationId}`)
                    .then(response => {
                        if (!response.ok) throw new Error("Location not found");
                        return response.json();
                    })
                    .then(data => {
                        // Check if data actually changed to prevent unnecessary DOM redraws
                        const currentDataString = JSON.stringify(data);
                        if(currentDataString === lastDataString) return;
                        lastDataString = currentDataString;

                        // Populate Header
                        document.getElementById('wall-title').textContent = data.title;
                        document.getElementById('wall-subtitle').textContent = data.subtitle;
                        document.getElementById('wall-description').textContent = data.description;

                        // Populate Grid
                        grid.innerHTML = '';
                        if (data.inductees.length === 0) {
                            grid.innerHTML = '<p style="text-align:center; width:100%; color:var(--text-secondary);">No inductees found for this location.</p>';
                        }

                        data.inductees.forEach(inductee => {
                            const plaque = document.createElement('div');
                            plaque.className = 'plaque';
                            plaque.innerHTML = `
                                <div class="plaque-image-wrapper">
                                    <img src="${inductee.image}" alt="${inductee.name}" loading="lazy">
                                </div>
                                <div class="plaque-content">
                                    <h2>${inductee.name}</h2>
                                    <h3>${inductee.award}</h3>
                                    <p>${inductee.bio}</p>
                                </div>
                            `;
                            
                            // Add click event for the modal
                            plaque.addEventListener('click', () => openModal(inductee));
                            grid.appendChild(plaque);
                        });
                    })
                    .catch(error => {
                        console.error("Error loading kiosk data:", error);
                        document.getElementById('wall-title').textContent = "Connection Error";
                        document.getElementById('wall-subtitle').textContent = "Please check server connection";
                    });
            }

            // Initial fetch
            fetchData();

            // Auto-refresh every 5 seconds to get updates from the admin panel
            setInterval(fetchData, 5000);

            // Modal Logic
            const modal = document.getElementById('modal-overlay');
            const closeBtn = document.getElementById('close-btn');

            function openModal(inductee) {
                document.getElementById('modal-image').src = inductee.image;
                document.getElementById('modal-name').textContent = inductee.name;
                document.getElementById('modal-award').textContent = inductee.award;
                document.getElementById('modal-bio').textContent = inductee.bio;
                
                modal.classList.add('active');
            }

            closeBtn.addEventListener('click', () => {
                modal.classList.remove('active');
            });

            modal.addEventListener('click', (e) => {
                if(e.target === modal) {
                    modal.classList.remove('active');
                }
            });
        });
    </script>
</body>
</html>
