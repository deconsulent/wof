<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>RTU Wall of Fame - V2 Native HUD Design (No 3D)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body, html { 
            margin: 0; padding: 0; height: 100%; 
            font-family: 'Inter', sans-serif; 
            background: #171b27; color: white; 
            overflow: hidden; 
        }
        
        .glass {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(38px) saturate(1.55);
            -webkit-backdrop-filter: blur(38px) saturate(1.55);
            border: 1px solid rgba(255,255,255,0.47);
            box-shadow: inset 0 1.5px 0 rgba(255,255,255,0.72), 0 12px 34px rgba(15,20,30,0.18);
        }
        
        #camera-feed {
            position: absolute; inset: 0; width: 100%; height: 100%; 
            object-fit: cover; opacity: 0; transition: opacity 0.6s; z-index: 0;
        }
        
        .overlay-gradient {
            position: absolute; inset: 0; pointer-events: none; z-index: 1;
            background: linear-gradient(180deg, rgba(16,22,34,.09), rgba(16,22,34,.02) 42%, rgba(16,22,34,.13));
        }

        .main-container {
            position: absolute; inset: 0; z-index: 10; overflow: auto; padding: 22px 24px 38px;
            display: none; /* Shown when data is loaded */
        }

        .header-bar {
            max-width: 1120px; padding: 13px 17px 13px 21px; margin: 0 auto 17px; 
            border-radius: 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
        }

        .tree-shell {
            max-width: 1120px; margin: 0 auto; border-radius: 30px; padding: clamp(20px,3vw,38px);
            min-height: 540px; overflow: hidden; position: relative;
        }

        .org-tree {
            position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center;
        }

        .lead-wrap {
            margin-bottom: 30px;
        }

        .report-grid {
            display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; width: 100%;
        }

        .tree-node {
            border-radius: 24px; padding: 17px 13px 15px; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; 
            text-align: center; width: 140px; min-height: 176px; cursor: pointer;
            transition: transform 0.2s;
        }
        
        .tree-node:hover {
            transform: translateY(-5px);
        }

        .tree-node.lead {
            width: 172px; min-height: 190px; border-radius: 28px; padding: 20px 16px 17px;
        }

        .avatar {
            border-radius: 50%; display: grid; place-items: center;
            color: rgba(255,255,255,.94); border: 1.5px solid rgba(255,255,255,.64);
            font-weight: 700; background-size: cover; background-position: center;
            width: 52px; height: 52px; flex: 0 0 auto;
        }
        
        .tree-node.lead .avatar {
            width: 61px; height: 61px;
        }

        /* Loading / Permission Screen */
        #status-screen {
            min-height: 100vh; display: grid; place-items: center; padding: 24px; 
            background: radial-gradient(circle at 50% 15%, #5a6688, #171b27 72%);
            position: relative; z-index: 50;
        }

        .status-box {
            max-width: 410px; padding: 30px; border-radius: 30px; text-align: center; color: white;
        }

    </style>
</head>
<body>

    <!-- Camera Feed -->
    <video id="camera-feed" muted playsinline></video>
    <div class="overlay-gradient"></div>

    <!-- Status Screen (GPS & Camera Init) -->
    <div id="status-screen">
        <div class="status-box glass">
            <div style="font-size: 34px; margin-bottom: 14px;">◌</div>
            <h1 id="status-title" style="margin: 0; font-size: 25px; letter-spacing: -.04em;">Initializing Space</h1>
            <p id="status-desc" style="color: rgba(255,255,255,.7); line-height: 1.55; font-size: 14px;">
                Requesting camera and GPS access to locate your nearest Wall of Fame...
            </p>
            <button id="start-btn" class="glass" style="display: none; padding: 12px 22px; color: white; cursor: pointer; border-radius: 99px; font-weight: 700; font-family: inherit; font-size: 14px; margin-top: 15px;">
                Enable Camera
            </button>
        </div>
    </div>

    <!-- Main V2 UI Overlay -->
    <main id="main-ui" class="main-container">
        <header class="header-bar glass">
            <div>
                <div style="color: white; font-size: 20px; font-weight: 700; letter-spacing: -.04em;">Wall of Fame</div>
                <div id="location-subtitle" style="color: rgba(255,255,255,.63); font-size: 10.5px; margin-top: 3px;">Locating...</div>
            </div>
            <div style="display: flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 99px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.3); color: rgba(255,255,255,.82); font-size: 11px;">
                <i style="width: 7px; height: 7px; border-radius: 50%; background: #65e98a; box-shadow: 0 0 9px #65e98a;"></i>
                HUD Live
            </div>
        </header>

        <section class="tree-shell glass">
            <div style="position: absolute; inset: 0; pointer-events: none; background: radial-gradient(circle at 50% 0%, rgba(255,255,255,.19), transparent 38%);"></div>
            
            <div style="position: relative; display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 26px;">
                <div>
                    <div style="color: rgba(255,255,255,.62); font-size: 10px; letter-spacing: .13em; text-transform: uppercase; font-weight: 700;">Hall of Fame</div>
                    <div id="zone-title" style="color: white; font-weight: 700; font-size: 18px; letter-spacing: -.03em; margin-top: 5px;">Department constellation</div>
                </div>
            </div>

            <div class="org-tree">
                <!-- Lead Inductee (Top) -->
                <div class="lead-wrap" id="lead-container"></div>
                
                <!-- Other Inductees (Grid) -->
                <div class="report-grid" id="reports-container"></div>
            </div>
        </section>
    </main>

    <script>
        const video = document.getElementById('camera-feed');
        const statusScreen = document.getElementById('status-screen');
        const statusTitle = document.getElementById('status-title');
        const statusDesc = document.getElementById('status-desc');
        const startBtn = document.getElementById('start-btn');
        const mainUi = document.getElementById('main-ui');
        
        const leadContainer = document.getElementById('lead-container');
        const reportsContainer = document.getElementById('reports-container');
        const locationSubtitle = document.getElementById('location-subtitle');
        const zoneTitle = document.getElementById('zone-title');

        // Colors for avatars (mimicking the V2 accents)
        const accents = ["#d865b5", "#92b7e5", "#ed947b", "#d1b357", "#b2b8d7", "#dc8d9b", "#d2a961", "#7c9aba", "#a18dc9"];

        function getInitials(name) {
            return name.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
        }

        function createPersonNode(person, isLead = false, index = 0) {
            const accent = accents[index % accents.length];
            
            const node = document.createElement('div');
            node.className = `tree-node glass ${isLead ? 'lead' : ''}`;
            
            // Build Avatar
            let avatarStyle = `background: linear-gradient(135deg, ${accent}cc, ${accent}52); box-shadow: 0 3px 14px ${accent}66, inset 0 1px 0 rgba(255,255,255,.65);`;
            let avatarContent = getInitials(person.name);
            
            if (person.image) {
                avatarStyle = `background-image: url('${person.image}'); box-shadow: 0 3px 14px ${accent}66, inset 0 1px 0 rgba(255,255,255,.65);`;
                avatarContent = ''; // Hide initials if image exists
            }

            const fontSize = isLead ? (person.image ? 0 : 17) : (person.image ? 0 : 14);

            node.innerHTML = `
                <div class="avatar" style="${avatarStyle} font-size: ${fontSize}px;">${avatarContent}</div>
                <span style="min-width: 0;">
                    <span style="display: block; color: rgba(255,255,255,.96); font-weight: 700; font-size: ${isLead ? 16 : 13}px; letter-spacing: -.025em; line-height: 1.15;">${person.name}</span>
                    <span style="display: block; margin-top: 6px; color: rgba(255,255,255,.67); font-size: 10.5px; line-height: 1.3;">${person.award || person.role || ''}</span>
                </span>
            `;
            return node;
        }

        function renderWall(locData) {
            locationSubtitle.textContent = `Wall of Fame · ${locData.inductees ? locData.inductees.length : 0} members · HUD view`;
            zoneTitle.textContent = locData.title || locData.name;

            leadContainer.innerHTML = '';
            reportsContainer.innerHTML = '';

            if (locData.inductees && locData.inductees.length > 0) {
                // First person is lead
                leadContainer.appendChild(createPersonNode(locData.inductees[0], true, 0));
                
                // Rest are reports
                for (let i = 1; i < locData.inductees.length; i++) {
                    reportsContainer.appendChild(createPersonNode(locData.inductees[i], false, i));
                }
            }

            // Hide status, show UI
            statusScreen.style.display = 'none';
            mainUi.style.display = 'block';
            video.style.opacity = '1';
        }

        async function startApp() {
            startBtn.style.display = 'none';
            statusTitle.textContent = "Acquiring GPS Lock...";
            statusDesc.textContent = "Please wait while we determine your location.";

            try {
                // 1. Start Camera
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: { ideal: "environment" } } 
                });
                video.srcObject = stream;
                video.play();

                // 2. Mock GPS for test file (always loads The Moon)
                const response = await fetch('/api/locations');
                const locations = await response.json();
                const stub = locations.find(l => l.id === 'the-moon') || locations[0];
                
                const locResponse = await fetch(`/api/locations/${stub.id}`);
                const locData = await locResponse.json();

                renderWall(locData);

            } catch (err) {
                console.error(err);
                statusTitle.textContent = "Access Denied / Error";
                statusDesc.textContent = err.message.includes("denied") ? 
                    "Camera permission denied. Allow access in browser settings and retry." : 
                    `Error: ${err.message}`;
                startBtn.style.display = 'inline-block';
            }
        }

        // Auto-start on load
        startBtn.addEventListener('click', startApp);
        startApp();

    </script>
</body>
</html>
