<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central Hub - Admin Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { 
            margin: 0; padding: 0; 
            font-family: 'Montserrat', sans-serif; 
            color: #eaffff; 
            background: radial-gradient(circle at 50% 24%, #123a4b 0, #06121f 40%, #02070d 100%);
            min-height: 100vh;
        }
        
        .navbar {
            padding: 20px 32px; border-bottom: 1px solid rgba(160, 244, 255, .3);
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(8,42,57,.28); backdrop-filter: blur(28px);
        }
        .navbar h1 { margin: 0; font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 12px; }
        .badge { background: #b9faff; color: #06222d; padding: 4px 10px; border-radius: 99px; font-size: 11px; font-weight: 800; }
        
        .container { max-width: 1400px; margin: 0 auto; padding: 32px; display: grid; grid-template-columns: 280px 1fr; gap: 32px; }
        
        /* Glass Card */
        .glass-card {
            background: rgba(8,42,57,.28); 
            border: 1px solid rgba(185,247,255,.3); 
            border-radius: 24px; 
            padding: 24px;
            box-shadow: inset 0 1px rgba(255,255,255,.2), 0 20px 60px rgba(0,0,0,.4); 
            backdrop-filter: blur(28px);
        }

        /* Sidebar List */
        .sidebar h2 { margin: 0 0 16px; font-size: 11px; text-transform: uppercase; color: #a9eff7; font-family: 'DM Mono', monospace; letter-spacing: 0.14em; }
        
        .screen-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
        .screen-item { 
            padding: 12px 16px; border-radius: 12px; cursor: pointer; transition: all 0.2s;
            border: 1px solid transparent; 
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(16,90,111,.2);
        }
        .screen-item:hover { background: rgba(16,90,111,.4); }
        .screen-item.active { background: rgba(116, 243, 255, .15); border-color: rgba(160, 244, 255, .5); box-shadow: 0 0 20px rgba(89,237,255,.15); }
        .screen-item span { font-weight: 600; font-size: 14px; }
        .screen-item small { font-family: 'DM Mono', monospace; font-size: 10px; color: #9fc8d2; }
        
        .btn { padding: 12px 18px; border: 1px solid #bcfaff; border-radius: 12px; color: #06222d; background: #b9faff; font-weight: 700; cursor: pointer; transition: 0.2s; text-decoration: none; display: inline-block; text-align: center; font-family: inherit; }
        .btn:hover { box-shadow: 0 0 28px rgba(111,240,255,.33); transform: translateY(-2px); }
        .btn-new { width: 100%; margin-top: 16px; }
        
        .btn-secondary { background: rgba(7,43,60,.5); color: #c2fbff; border-color: rgba(160,244,255,.3); }
        .btn-secondary:hover { background: rgba(16,90,111,.6); box-shadow: none; }
        
        .btn-danger { background: rgba(220, 38, 38, 0.2); color: #fca5a5; border-color: rgba(248, 113, 113, 0.4); }
        .btn-danger:hover { background: rgba(220, 38, 38, 0.4); }

        /* Main Editor */
        .editor { display: none; }
        .editor.visible { display: block; }
        .editor-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; padding-bottom: 24px; border-bottom: 1px solid rgba(160,244,255,.2); }
        .editor-header h2 { margin: 0 0 8px; font-size: 28px; font-weight: 700; letter-spacing: -0.05em; }
        .editor-header p { margin: 0; color: #a9eff7; font-family: 'DM Mono', monospace; font-size: 12px; }
        
        .actions { display: flex; gap: 12px; }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 32px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-group.full { grid-column: span 2; }
        .form-group label { font-size: 11px; font-family: 'DM Mono', monospace; color: #a9eff7; letter-spacing: 0.1em; }
        .form-group input, .form-group textarea, .form-group select {
            background: rgba(0,0,0,0.3); border: 1px solid rgba(160,244,255,.2); color: white; padding: 14px; border-radius: 12px; font-family: inherit; font-size: 14px; outline: none; transition: 0.2s;
        }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color: #a6faff; box-shadow: 0 0 15px rgba(166,250,255,.1); }
        
        /* Section Headers */
        .section-header { display: flex; justify-content: space-between; align-items: center; margin: 32px 0 16px; padding-top: 24px; border-top: 1px solid rgba(160,244,255,.2); }
        .section-header h3 { margin: 0; font-size: 18px; font-weight: 700; color: #c9fcff; }

        /* Dynamic Template Sections */
        .template-section { display: none; }
        .template-section.active { display: block; }

        /* Lists */
        .list-container { display: flex; flex-direction: column; gap: 12px; }
        .list-item {
            background: rgba(0,0,0,0.2); border: 1px solid rgba(160,244,255,.15); border-radius: 16px; padding: 16px;
            display: grid; grid-template-columns: auto 1fr auto; gap: 20px; align-items: center;
        }
        .list-avatar {
            width: 56px; height: 56px; border-radius: 12px; background: rgba(16,90,111,.4); display: grid; place-items: center;
            font-size: 18px; font-weight: bold; overflow: hidden; position: relative; border: 1px solid rgba(160,244,255,.3);
        }
        .list-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .list-info h4 { margin: 0 0 4px; font-size: 16px; font-weight: 600; }
        .list-info p { margin: 0; color: #9fc8d2; font-size: 12px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        .list-info span { background: rgba(16,90,111,.4); padding: 4px 8px; border-radius: 6px; font-family: 'DM Mono', monospace; font-size: 10px; }
        
        /* Image Upload */
        .image-upload-wrapper { display: flex; gap: 16px; align-items: center; }
        .image-preview-box { width: 80px; height: 80px; border-radius: 12px; background: rgba(0,0,0,0.3); border: 1px dashed rgba(160,244,255,.3); overflow: hidden; display: grid; place-items: center; color: #a9eff7; font-size: 24px; position: relative; }
        .image-preview-box img { width: 100%; height: 100%; object-fit: cover; display: none; }
        .image-preview-box input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

        /* Modal */
        .modal-overlay { position: fixed; inset: 0; background: rgba(2, 7, 13, 0.85); backdrop-filter: blur(8px); display: none; place-items: center; z-index: 100; }
        .modal-overlay.visible { display: grid; }
        .modal { width: 100%; max-width: 640px; max-height: 90vh; overflow-y: auto; }
        .modal h3 { margin: 0 0 24px; font-size: 22px; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 32px; padding-top: 24px; border-top: 1px solid rgba(160,244,255,.2); }
    </style>
</head>
<body>

    <nav class="navbar">
        <h1>Wall of Fame <span class="badge">Spatial CMS</span></h1>
    </nav>

    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar glass-card">
            <h2>Active Screens</h2>
            <ul class="screen-list" id="screen-list"></ul>
            <button class="btn btn-new" onclick="createNewScreen()">+ Create New Screen</button>
        </aside>

        <!-- Main Editor -->
        <main class="editor glass-card" id="editor">
            <div class="editor-header">
                <div>
                    <h2 id="edit-header-title">Select a screen</h2>
                    <p>LOCATION ID: <span id="edit-header-id">-</span></p>
                </div>
                <div class="actions">
                    <a href="#" target="_blank" class="btn btn-secondary" id="btn-view">Test View ↗</a>
                    <button class="btn" onclick="saveLocation()">Save Changes</button>
                    <button class="btn btn-danger" onclick="deleteLocation()">Delete</button>
                </div>
            </div>

            <!-- Core Fields (All Templates) -->
            <div class="form-grid">
                <div class="form-group">
                    <label>INTERNAL NAME</label>
                    <input type="text" id="loc-name">
                </div>
                <div class="form-group">
                    <label>TEMPLATE ENGINE</label>
                    <select id="loc-template" onchange="onTemplateChange()">
                        <option value="designfactory">V4: Hierarchy Tree (DesignFactory)</option>
                        <option value="swup">V5: Team Profile (SWUP)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>LATITUDE</label>
                    <input type="number" id="loc-lat" step="any">
                </div>
                <div class="form-group">
                    <label>LONGITUDE</label>
                    <input type="number" id="loc-lng" step="any">
                </div>
                <div class="form-group">
                    <label>DISPLAY TITLE</label>
                    <input type="text" id="loc-title">
                </div>
                <div class="form-group">
                    <label>DISPLAY SUBTITLE</label>
                    <input type="text" id="loc-subtitle">
                </div>
                <div class="form-group full">
                    <label>DESCRIPTION</label>
                    <textarea id="loc-desc" rows="2"></textarea>
                </div>
            </div>

            <!-- Dynamic Template Section: V4 Hierarchy (DesignFactory) -->
            <div id="section-designfactory" class="template-section">
                <div class="section-header">
                    <h3>Hierarchy Tree Data</h3>
                    <button class="btn btn-secondary" onclick="openV4Modal()">+ Add Person</button>
                </div>
                <div class="list-container" id="v4-list"></div>
            </div>

            <!-- Dynamic Template Section: V5 Team Profile (SWUP) -->
            <div id="section-swup" class="template-section">
                <div class="section-header">
                    <h3>Team Details</h3>
                </div>
                <div class="form-grid">
                    <div class="form-group">
                        <label>TEAM NAME</label>
                        <input type="text" id="v5-teamName" placeholder="e.g. TEAM SWUP">
                    </div>
                    <div class="form-group">
                        <label>DESTINATION URL</label>
                        <input type="text" id="v5-teamUrl" placeholder="Redirect link on click">
                    </div>
                    <div class="form-group full">
                        <label>TEAM PHOTO</label>
                        <div class="image-upload-wrapper">
                            <div class="image-preview-box">
                                <img id="v5-teamPhoto-preview">
                                <input type="file" onchange="uploadImage(this, 'v5-teamPhoto')">
                                <span style="position:absolute;z-index:-1">+</span>
                            </div>
                            <input type="hidden" id="v5-teamPhoto">
                            <small style="color:var(--text-muted)">Click box to upload (Local storage for now)</small>
                        </div>
                    </div>
                </div>

                <div class="section-header">
                    <h3>Team Members</h3>
                    <button class="btn btn-secondary" onclick="openV5Modal()">+ Add Member</button>
                </div>
                <div class="list-container" id="v5-list"></div>
            </div>
        </main>
    </div>

    <!-- Modals -->
    <!-- V4 Inductee Modal -->
    <div class="modal-overlay" id="v4-modal">
        <div class="glass-card modal">
            <h3 id="v4-modal-title">Edit Person</h3>
            <div class="form-grid">
                <div class="form-group full">
                    <label>PHOTO</label>
                    <div class="image-upload-wrapper">
                        <div class="image-preview-box"><img id="v4-photo-preview"><input type="file" onchange="uploadImage(this, 'v4-photo')"><span style="position:absolute;z-index:-1">+</span></div>
                        <input type="hidden" id="v4-photo">
                    </div>
                </div>
                <div class="form-group"><label>FULL NAME</label><input type="text" id="v4-name"></div>
                <div class="form-group"><label>ROLE / TITLE</label><input type="text" id="v4-role"></div>
                <div class="form-group">
                    <label>LEVEL</label>
                    <select id="v4-level"><option value="root">Root</option><option value="lead">Lead</option><option value="member">Member</option></select>
                </div>
                <div class="form-group"><label>ACCENT COLOR</label><input type="color" id="v4-accent" style="height:44px;width:100%;padding:2px;"></div>
            </div>
            <input type="hidden" id="v4-index">
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="document.getElementById('v4-modal').classList.remove('visible')">Cancel</button>
                <button class="btn" onclick="saveV4Person()">Save Person</button>
            </div>
        </div>
    </div>

    <!-- V5 Member Modal -->
    <div class="modal-overlay" id="v5-modal">
        <div class="glass-card modal">
            <h3 id="v5-modal-title">Edit Team Member</h3>
            <div class="form-grid">
                <div class="form-group full">
                    <label>PHOTO</label>
                    <div class="image-upload-wrapper">
                        <div class="image-preview-box"><img id="v5-photo-preview"><input type="file" onchange="uploadImage(this, 'v5-photo')"><span style="position:absolute;z-index:-1">+</span></div>
                        <input type="hidden" id="v5-photo">
                    </div>
                </div>
                <div class="form-group"><label>NAME</label><input type="text" id="v5-name"></div>
                <div class="form-group"><label>ACCENT COLOR</label><input type="color" id="v5-accent" style="height:44px;width:100%;padding:2px;"></div>
                <div class="form-group"><label>CROP (CSS object-position)</label><input type="text" id="v5-crop" placeholder="e.g. 50% 28%"></div>
            </div>
            <input type="hidden" id="v5-index">
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="document.getElementById('v5-modal').classList.remove('visible')">Cancel</button>
                <button class="btn" onclick="saveV5Member()">Save Member</button>
            </div>
        </div>
    </div>

    <script>
        let locations = [];
        let currentLocation = null;
        let isEditing = false;

        async function fetchLocations() {
            const res = await fetch('/api/locations');
            locations = await res.json();
            renderSidebar();
        }

        function renderSidebar() {
            const list = document.getElementById('screen-list');
            list.innerHTML = '';
            locations.forEach(loc => {
                const li = document.createElement('li');
                li.className = `screen-item ${currentLocation && currentLocation.id === loc.id ? 'active' : ''}`;
                li.innerHTML = `<span>${loc.name}</span><small>${loc.id}</small>`;
                li.onclick = () => selectLocation(loc.id);
                list.appendChild(li);
            });
        }

        async function selectLocation(id) {
            const res = await fetch(`/api/locations/${id}`);
            let data = await res.json();
            
            // Backwards compatibility migration for old locations without the .data wrapper
            if (!data.data) {
                data.data = { inductees: data.inductees || [] };
                delete data.inductees;
            }

            currentLocation = data;
            isEditing = true;
            renderSidebar();
            populateEditor();
            document.getElementById('editor').classList.add('visible');
        }

        function createNewScreen() {
            const id = prompt("Enter a unique ID for the new screen (e.g. 'library'):");
            if (!id) return;
            if (locations.find(l => l.id === id)) return alert("ID already exists!");
            
            currentLocation = {
                id: id.toLowerCase().replace(/[^a-z0-9-]/g, '-'),
                name: "New Screen",
                template: "designfactory",
                title: "", subtitle: "", description: "", lat: 0, lng: 0, radius: 50,
                data: { inductees: [] }
            };
            isEditing = false;
            populateEditor();
            document.getElementById('editor').classList.add('visible');
            document.querySelectorAll('.screen-item').forEach(el => el.classList.remove('active'));
        }

        function populateEditor() {
            document.getElementById('edit-header-title').textContent = currentLocation.name;
            document.getElementById('edit-header-id').textContent = currentLocation.id;
            
            document.getElementById('loc-name').value = currentLocation.name || '';
            document.getElementById('loc-template').value = currentLocation.template || 'designfactory';
            document.getElementById('loc-lat').value = currentLocation.lat || 0;
            document.getElementById('loc-lng').value = currentLocation.lng || 0;
            document.getElementById('loc-title').value = currentLocation.title || '';
            document.getElementById('loc-subtitle').value = currentLocation.subtitle || '';
            document.getElementById('loc-desc').value = currentLocation.description || '';

            document.getElementById('btn-view').href = `/view/${currentLocation.id}`;
            onTemplateChange();
        }

        function onTemplateChange() {
            const tmpl = document.getElementById('loc-template').value;
            
            // Hide all
            document.querySelectorAll('.template-section').forEach(el => el.classList.remove('active'));
            
            // Migrate data if switching templates completely breaks schema
            if (!currentLocation.data) currentLocation.data = {};

            // Show and render specific template fields
            if (tmpl === 'designfactory') {
                if (!currentLocation.data.inductees) currentLocation.data.inductees = [];
                document.getElementById('section-designfactory').classList.add('active');
                renderV4List();
            } else if (tmpl === 'swup') {
                if (!currentLocation.data.members) currentLocation.data.members = [];
                document.getElementById('section-swup').classList.add('active');
                
                document.getElementById('v5-teamName').value = currentLocation.data.teamName || '';
                document.getElementById('v5-teamUrl').value = currentLocation.data.teamDestination || '';
                
                const photoInput = document.getElementById('v5-teamPhoto');
                const photoPreview = document.getElementById('v5-teamPhoto-preview');
                photoInput.value = currentLocation.data.teamPhoto || '';
                if (photoInput.value) {
                    photoPreview.src = photoInput.value;
                    photoPreview.style.display = 'block';
                } else {
                    photoPreview.style.display = 'none';
                }

                renderV5List();
            }
        }

        // --- V4 Logic ---
        function renderV4List() {
            const list = document.getElementById('v4-list');
            list.innerHTML = '';
            const data = currentLocation.data.inductees;
            if (!data || data.length === 0) return list.innerHTML = '<p>No people added yet.</p>';

            data.forEach((ind, i) => {
                const el = document.createElement('div');
                el.className = 'list-item';
                el.innerHTML = `
                    <div class="list-avatar" style="border-color:${ind.accent}">${ind.photo ? `<img src="${ind.photo}">` : '👤'}</div>
                    <div class="list-info"><h4>${ind.name}</h4><p>${ind.role} <span>LVL: ${ind.level}</span></p></div>
                    <div class="actions">
                        <button class="btn btn-secondary" onclick="openV4Modal(${i})" style="padding:8px 12px">Edit</button>
                        <button class="btn btn-danger" onclick="deleteV4Person(${i})" style="padding:8px 12px">X</button>
                    </div>`;
                list.appendChild(el);
            });
        }
        function openV4Modal(index = -1) {
            const ind = index === -1 ? { name: '', role: '', level: 'member', accent: '#9ec6ef', photo: '' } : currentLocation.data.inductees[index];
            document.getElementById('v4-index').value = index;
            document.getElementById('v4-name').value = ind.name || '';
            document.getElementById('v4-role').value = ind.role || '';
            document.getElementById('v4-level').value = ind.level || 'member';
            document.getElementById('v4-accent').value = ind.accent || '#9ec6ef';
            
            document.getElementById('v4-photo').value = ind.photo || '';
            const prev = document.getElementById('v4-photo-preview');
            prev.src = ind.photo || '';
            prev.style.display = ind.photo ? 'block' : 'none';
            
            document.getElementById('v4-modal').classList.add('visible');
        }
        function saveV4Person() {
            const index = parseInt(document.getElementById('v4-index').value);
            const ind = {
                id: document.getElementById('v4-name').value.toLowerCase().replace(/[^a-z0-9]/g, '-'),
                name: document.getElementById('v4-name').value,
                role: document.getElementById('v4-role').value,
                initials: document.getElementById('v4-name').value.substring(0,2).toUpperCase(),
                level: document.getElementById('v4-level').value,
                accent: document.getElementById('v4-accent').value,
                photo: document.getElementById('v4-photo').value
            };
            if (index === -1) currentLocation.data.inductees.push(ind);
            else currentLocation.data.inductees[index] = ind;
            renderV4List();
            document.getElementById('v4-modal').classList.remove('visible');
        }
        function deleteV4Person(i) {
            if(!confirm("Remove?")) return;
            currentLocation.data.inductees.splice(i, 1);
            renderV4List();
        }

        // --- V5 Logic ---
        function renderV5List() {
            const list = document.getElementById('v5-list');
            list.innerHTML = '';
            const data = currentLocation.data.members;
            if (!data || data.length === 0) return list.innerHTML = '<p>No members added yet.</p>';

            data.forEach((m, i) => {
                const el = document.createElement('div');
                el.className = 'list-item';
                el.innerHTML = `
                    <div class="list-avatar" style="border-color:${m.accent}">${m.photo ? `<img src="${m.photo}" style="object-position:${m.crop||'center'}">` : '👤'}</div>
                    <div class="list-info"><h4>${m.name}</h4><p><span>CROP: ${m.crop || 'center'}</span></p></div>
                    <div class="actions">
                        <button class="btn btn-secondary" onclick="openV5Modal(${i})" style="padding:8px 12px">Edit</button>
                        <button class="btn btn-danger" onclick="deleteV5Member(${i})" style="padding:8px 12px">X</button>
                    </div>`;
                list.appendChild(el);
            });
        }
        function openV5Modal(index = -1) {
            const m = index === -1 ? { name: '', accent: '#b7f8ff', photo: '', crop: '50% 28%' } : currentLocation.data.members[index];
            document.getElementById('v5-index').value = index;
            document.getElementById('v5-name').value = m.name || '';
            document.getElementById('v5-accent').value = m.accent || '#b7f8ff';
            document.getElementById('v5-crop').value = m.crop || '';
            
            document.getElementById('v5-photo').value = m.photo || '';
            const prev = document.getElementById('v5-photo-preview');
            prev.src = m.photo || '';
            prev.style.display = m.photo ? 'block' : 'none';
            
            document.getElementById('v5-modal').classList.add('visible');
        }
        function saveV5Member() {
            const index = parseInt(document.getElementById('v5-index').value);
            const m = {
                id: document.getElementById('v5-name').value.toLowerCase().replace(/[^a-z0-9]/g, '-'),
                name: document.getElementById('v5-name').value,
                accent: document.getElementById('v5-accent').value,
                crop: document.getElementById('v5-crop').value,
                photo: document.getElementById('v5-photo').value
            };
            if (index === -1) currentLocation.data.members.push(m);
            else currentLocation.data.members[index] = m;
            renderV5List();
            document.getElementById('v5-modal').classList.remove('visible');
        }
        function deleteV5Member(i) {
            if(!confirm("Remove?")) return;
            currentLocation.data.members.splice(i, 1);
            renderV5List();
        }

        // --- Global Logic ---
        async function saveLocation() {
            currentLocation.name = document.getElementById('loc-name').value;
            currentLocation.template = document.getElementById('loc-template').value;
            currentLocation.lat = parseFloat(document.getElementById('loc-lat').value);
            currentLocation.lng = parseFloat(document.getElementById('loc-lng').value);
            currentLocation.title = document.getElementById('loc-title').value;
            currentLocation.subtitle = document.getElementById('loc-subtitle').value;
            currentLocation.description = document.getElementById('loc-desc').value;

            if (currentLocation.template === 'swup') {
                currentLocation.data.teamName = document.getElementById('v5-teamName').value;
                currentLocation.data.teamDestination = document.getElementById('v5-teamUrl').value;
                currentLocation.data.teamPhoto = document.getElementById('v5-teamPhoto').value;
            }

            const method = isEditing ? 'PUT' : 'POST';
            const url = isEditing ? `/api/locations/${currentLocation.id}` : `/api/locations`;
            
            const res = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(currentLocation) });
            if (res.ok) {
                alert("Saved successfully!");
                fetchLocations();
                if (!isEditing) selectLocation(currentLocation.id);
            }
        }

        async function deleteLocation() {
            if (!confirm("Are you sure you want to delete this screen?")) return;
            await fetch(`/api/locations/${currentLocation.id}`, { method: 'DELETE' });
            currentLocation = null;
            document.getElementById('editor').classList.remove('visible');
            fetchLocations();
        }

        async function uploadImage(input, hiddenId) {
            const file = input.files[0];
            if (!file) return;
            
            const formData = new FormData();
            formData.append('image', file);

            try {
                const res = await fetch('/api/upload', { method: 'POST', body: formData });
                const data = await res.json();
                if (data.url) {
                    document.getElementById(hiddenId).value = data.url;
                    const preview = document.getElementById(hiddenId + '-preview');
                    preview.src = data.url;
                    preview.style.display = 'block';
                }
            } catch (err) {
                alert('Upload failed.');
            }
        }

        fetchLocations();
    </script>
</body>
</html>
